name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Publish and release
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test NotepadPro.sln -c Release

      - name: Publish
        run: dotnet publish src/NotepadPro/NotepadPro.csproj -c Release -o dist -p:DebugType=None -p:DebugSymbols=false

      - name: Package release assets
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist/NotepadPro.exe package/
          Copy-Item README.md, LICENSE, install.ps1, uninstall.ps1 package/
          Compress-Archive -Path package/* -DestinationPath "NotepadPro-$version-win-x64.zip"
          $exeHash = (Get-FileHash dist/NotepadPro.exe -Algorithm SHA256).Hash
          $zipHash = (Get-FileHash "NotepadPro-$version-win-x64.zip" -Algorithm SHA256).Hash
          "$exeHash  NotepadPro.exe" | Set-Content SHA256SUMS.txt
          "$zipHash  NotepadPro-$version-win-x64.zip" | Add-Content SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          gh release create $tag dist/NotepadPro.exe "NotepadPro-$version-win-x64.zip" SHA256SUMS.txt `
            --title "Notepad Pro $version" `
            --generate-notes
